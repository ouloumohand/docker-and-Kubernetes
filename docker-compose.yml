version: "3.9"

services:
  app:
    build: .
    container_name: fastapi-app1
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  playwright:
    image: mcr.microsoft.com/playwright:v1.60.0-jammy
    depends_on:
      app:
        condition: service_healthy
    working_dir: /tests
    volumes:
      - ./:/tests
    environment:
      BASE_URL: "http://fastapi-app1:8000"
    command: >
      npx playwright test --reporter=html
